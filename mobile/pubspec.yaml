name: meiko_app
description: "Meiko — your open, pluggable autonomous AI agent."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  flutter_markdown: ^0.7.4
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0B1C"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
