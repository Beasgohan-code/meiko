<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a12" />
    <title>Meiko — Your Autonomous AI Agent</title>
    <meta name="description" content="Meiko is an open, pluggable AI agent with tools, memory, connectors, and agent modes — chat, research, code, and create." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before paint to avoid a dark->light flash.
      (function () {
        try {
          var t = localStorage.getItem("meiko_theme") || "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
