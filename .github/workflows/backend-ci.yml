name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch: {}

jobs:
  test:
    name: Lint & smoke test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app tests --exit-zero

      - name: Import smoke test (app must build without a running server)
        run: python -c "from app.main import app; print('Meiko backend imported OK with', len(app.routes), 'routes')"

      - name: Run pytest suite
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t meiko-backend:ci .
